name=LootRarityMarker
displayName=战利品品质标记 (Loot Rarity Marker)
description=按周围容器内最高价值稀有度物品给交互点染色，颜色与物品价值稀有度 mod 同款；支持按价值排序、单件最高价值发光，以及默认关闭的容器本体描边。扫描和重算使用非分配查询、事件驱动和单帧时间预算，零 Harmony 补丁。数值可在 ModConfig 或 config.json 中调整。Tints container interaction markers by item value rarity. Optional container outlining is disabled by default. Zero Harmony patches.
version=1.0.0
tags=Gameplay
