name=LootRarityMarker
displayName=更好的搜索显示
description=按周围容器内最高价值稀有度物品给交互点染色；愿望单物品显示亮青色并可使用亮青色描边；支持按价值排序、发光，以及默认关闭的容器本体描边。扫描和重算使用非分配查询、事件驱动和单帧时间预算，零 Harmony 补丁。数值可在 ModConfig 或 config.json 中调整。Tints container interaction markers by item value rarity. Wishlisted items are bright cyan (#00E5FF), with optional cyan outlining. Optional container outlining is disabled by default. Zero Harmony patches.
version=1.0.2
tags=Gameplay
