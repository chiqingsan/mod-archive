name=HeadshotBulletRefund
displayName=爆头回弹 (Headshot Bullet Refund)
description=爆头击杀敌人后，把击杀时使用的那颗子弹直接补回枪械弹匣（不进入备弹）。数值可在游戏内设置菜单调整（需 ModConfig），也可改 config.json。Headshot kill refunds rounds of the exact ammo used into the magazine. Configurable count/conditions. Zero Harmony patches.
version=1.0.0
tags=Gameplay
